name: CI — Reference App Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/python/**'
      - 'apps/nodejs/**'
      - 'tests/test_*.py'
      - 'docs/reference/platform-limits.md'
      - 'docs/language-guides/python/recipes/http-api.md'
      - 'docs/language-guides/python/recipes/managed-identity.md'
      - 'docs/language-guides/python/recipes/retry.md'
      - 'docs/operations/retries-and-poison-handling.md'
      - '.github/workflows/python-eventhub-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-eventhub-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -r apps/python/requirements.txt pytest ruff
      - name: Run local Python reference tests
        run: python -m pytest tests -q
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run local Node.js reference tests
        working-directory: apps/nodejs
        run: npm ci && npm test
