name: CI — .NET Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/dotnet/**'
      - 'tests/dotnet/**'
      - '.github/workflows/dotnet-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build reference app and tests
        run: dotnet build tests/dotnet/AzureFunctionsGuide.Tests.csproj
      - name: Run local storage probe tests
        run: dotnet test tests/dotnet/AzureFunctionsGuide.Tests.csproj --no-build
