name: Feature or Content Request
description: Suggest a new section, guide, lab, workflow, or improvement.
title: "docs: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the issue in this guide and explain why any external project
        or source is relevant. Use this repository's evidence and completion criteria.
        See [Issue Scope](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-scope).
        Follow [CONTRIBUTING.md](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-lifecycle) for titles, required sections, and triage.
        Maintainers retain `needs-triage` until validity, duplicates, scope, type, backlog-relative priority, and size are checked. Triaged work needs one `priority:critical/high/medium/low` and one `size: XS/S/M/L/XL` label; missing labels are a maintainer prerequisite, not automatic enforcement.
        For trackers/decisions, follow the [lighter path](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#trackers-and-executable-issues): state tracking-only/decision-only, links/options and a closure condition; explain non-applicable execution fields.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short summary of the request.
      placeholder: Add troubleshooting guidance for Durable Functions.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Context
      description: Explain the repository-local gap, one bounded deliverable, affected files and applicable plan/language/lab/diagram IDs.
      placeholder: Readers need...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution or content
      description: Describe the change you would like to see.
      placeholder: A new page or section covering...
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification and access
      description: State the verification method and Azure/manual-access needs (or None), including cost/teardown for live work. For run/capture work, provide retained locator, source revision, sanitized environment, original time and tool/method; before execution, describe the planned record and mark missing evidence NOT_RUN/NOT_CAPTURED. Otherwise state that run/capture evidence is not applicable.
      placeholder: Targeted local checks; no Azure access needed. Run/capture evidence is not applicable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Checklist
      description: Observable, repository-local completion criteria.
      placeholder: "- [ ] The requested guidance solves the stated reader scenario with sourced evidence."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Bound the request; exclude speculative additions and unrelated improvements.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Dependencies and relevant issues, PRs or official sources with their local relationship; explicitly state dependencies or None.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Intended audience or scenario
      description: Describe who would benefit and in what situation.
      placeholder: Developers and operators troubleshooting...
    validations:
      required: false
