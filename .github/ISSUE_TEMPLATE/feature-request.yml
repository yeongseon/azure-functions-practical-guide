name: Feature or Content Request
description: Suggest a new section, guide, lab, workflow, or improvement.
title: "docs: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the issue in this guide and explain why any external project
        or source is relevant. Use this repository's evidence and completion criteria.
        See [Issue Scope](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-scope).
        Follow [CONTRIBUTING.md](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-lifecycle) for titles, required sections, and triage.
        Maintainers retain `needs-triage` until validity, duplicates, scope, type, backlog-relative priority, and size are checked. Triaged work needs one `priority:critical/high/medium/low` and one `size: XS/S/M/L/XL` label; missing labels are a maintainer prerequisite, not automatic enforcement.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short summary of the request.
      placeholder: Add troubleshooting guidance for Durable Functions.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Context
      description: Explain the problem, goal, or gap this request would address.
      placeholder: Readers need...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution or content
      description: Describe the change you would like to see.
      placeholder: A new page or section covering...
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Checklist
      description: Observable, repository-local completion criteria.
      placeholder: "- [ ] The requested guidance solves the stated reader scenario with sourced evidence."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Bound the request; exclude speculative additions and unrelated improvements.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Relevant issues, PRs, official sources or upstream dependencies with their local relationship; write None if absent.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Intended audience or scenario
      description: Describe who would benefit and in what situation.
      placeholder: Developers and operators troubleshooting...
    validations:
      required: false
