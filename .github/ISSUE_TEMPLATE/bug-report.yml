name: Bug Report
description: Report a repository bug, broken workflow, or incorrect behavior.
title: "fix: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the issue in this guide and explain why any external project
        or source is relevant. Use this repository's evidence and completion criteria.
  See [Issue Scope](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-scope).
        Follow [CONTRIBUTING.md](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-lifecycle) for titles, required sections, and triage.
        Maintainers retain `needs-triage` until validity, duplicates, scope, type, backlog-relative priority, and size are checked. Triaged work needs one `priority:critical/high/medium/low` and one `size: XS/S/M/L/XL` label; missing labels are a maintainer prerequisite, not automatic enforcement.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short summary of the problem.
      placeholder: The docs build fails when...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Context
      description: Describe what happened, what you expected, and any relevant context.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation or evidence
      description: Share logs, screenshots, links, or other evidence.
      placeholder: Paste relevant output or links here.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Checklist
      description: Observable completion criteria, not unperformed test claims.
      placeholder: "- [ ] The reported behavior is corrected and a targeted regression check passes."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State what this fix will not change.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Relevant issues, PRs, official sources or upstream dependencies with their local relationship; write None if absent.
    validations:
      required: true
