name: Documentation Correction
description: Report incorrect, outdated, or unclear documentation.
title: "docs: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the issue in this guide and explain why any external project
        or source is relevant. Use this repository's evidence and completion criteria.
        See [Issue Scope](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-scope).
        Follow [CONTRIBUTING.md](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#issue-lifecycle) for titles, required sections, and triage.
        Maintainers retain `needs-triage` until validity, duplicates, scope, type, backlog-relative priority, and size are checked. Triaged work needs one `priority:critical/high/medium/low` and one `size: XS/S/M/L/XL` label; missing labels are a maintainer prerequisite, not automatic enforcement.
        For trackers/decisions, follow the [lighter path](https://github.com/yeongseon/azure-functions-practical-guide/blob/main/CONTRIBUTING.md#trackers-and-executable-issues): state tracking-only/decision-only, links/options and a closure condition; explain non-applicable execution fields.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short summary of the documentation problem.
      placeholder: The Functions hosting page links to the wrong article.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Context
      description: Explain the reader impact and one bounded correction; identify applicable plan/language/lab/diagram IDs or say not applicable.
      placeholder: Describe the current wording and the problem it causes.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page or file
      description: Provide the page URL or repository file path.
      placeholder: docs/platform/hosting-plans.md
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested correction
      description: Share the correction you expect, if known.
      placeholder: Replace the current sentence with...
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification and access
      description: State the verification method and Azure/manual-access needs (or None), including cost/teardown for live work. For run/capture work, provide retained locator, source revision, sanitized environment, original time and tool/method; before execution, describe the planned record and mark missing evidence NOT_RUN/NOT_CAPTURED. Otherwise state that run/capture evidence is not applicable.
      placeholder: Source review and strict build; no Azure access needed. Run/capture evidence is not applicable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Checklist
      description: Observable completion criteria; distinguish source review from actual Azure validation.
      placeholder: "- [ ] The affected claim is corrected against a cited Microsoft Learn source."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State which pages or behaviors this correction will not change.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Dependencies and relevant issues, PRs or official sources with their local relationship; explicitly state dependencies or None.
    validations:
      required: true
